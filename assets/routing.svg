<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-label="Comparison of tokens injected per turn: a fixed block costs the same on every turn, grain costs nothing on conversational turns.">
  <rect width="840" height="420" rx="10" fill="#12161c"/>

  <text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" font-weight="600">tokens injected per turn</text>
  <text x="32" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">measured over real prompts, not a simulation</text>

  <text x="470" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7d8590">fixed block</text>
  <text x="640" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7d8590">grain</text>

  <line x1="32" y1="108" x2="808" y2="108" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
    <text x="32" y="140" fill="#adbac7">"yes"</text>
    <rect x="470" y="129" width="96" height="15" rx="3" fill="#6e40c9"/>
    <text x="574" y="141" fill="#7d8590" font-size="11.5">~1000</text>
    <text x="640" y="141" fill="#3fb950" font-weight="600">0</text>

    <text x="32" y="176" fill="#adbac7">"thanks, that worked"</text>
    <rect x="470" y="165" width="96" height="15" rx="3" fill="#6e40c9"/>
    <text x="574" y="177" fill="#7d8590" font-size="11.5">~1000</text>
    <text x="640" y="177" fill="#3fb950" font-weight="600">0</text>

    <text x="32" y="212" fill="#adbac7">"what did that do?"</text>
    <rect x="470" y="201" width="96" height="15" rx="3" fill="#6e40c9"/>
    <text x="574" y="213" fill="#7d8590" font-size="11.5">~1000</text>
    <text x="640" y="213" fill="#3fb950" font-weight="600">0</text>

    <text x="32" y="248" fill="#adbac7">"redesign the orders schema"</text>
    <rect x="470" y="237" width="96" height="15" rx="3" fill="#6e40c9"/>
    <text x="574" y="249" fill="#7d8590" font-size="11.5">~1000</text>
    <text x="640" y="249" fill="#3fb950" font-weight="600">0</text>
    <text x="668" y="249" fill="#7d8590" font-size="11">two modes tied, so it abstains</text>

    <text x="32" y="284" fill="#adbac7">"refactor the parser"</text>
    <rect x="470" y="273" width="96" height="15" rx="3" fill="#6e40c9"/>
    <text x="574" y="285" fill="#7d8590" font-size="11.5">~1000</text>
    <rect x="640" y="273" width="24" height="15" rx="3" fill="#3fb950"/>
    <text x="672" y="285" fill="#adbac7" font-size="11.5">249</text>

    <text x="32" y="320" fill="#adbac7">"draft the release notes"</text>
    <rect x="470" y="309" width="96" height="15" rx="3" fill="#6e40c9"/>
    <text x="574" y="321" fill="#7d8590" font-size="11.5">~1000</text>
    <rect x="640" y="309" width="21" height="15" rx="3" fill="#3fb950"/>
    <text x="669" y="321" fill="#adbac7" font-size="11.5">217</text>
  </g>

  <line x1="32" y1="348" x2="808" y2="348" stroke="#30363d" stroke-width="1"/>

  <text x="32" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">A fixed block pays on every turn, so it has to earn it back on every turn.</text>
  <text x="32" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">grain routes instead. Input tokens only. It never touches the reasoning budget.</text>
</svg>
