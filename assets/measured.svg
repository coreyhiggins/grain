<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-label="Routing accuracy: 63 percent on the 280 prompts written to test grain, 27 percent on the 363 prompts people actually typed, and 80 percent for a control that always answers engineering.">
  <rect width="840" height="400" rx="10" fill="#12161c"/>

  <text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" font-weight="600">grain routing accuracy, measured twice</text>
  <text x="32" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">one corpus written for the router, one written by people</text>

  <line x1="32" y1="88" x2="808" y2="88" stroke="#30363d" stroke-width="1"/>

  <text x="32" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7d8590">what was measured</text>
  <text x="310" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7d8590">routing accuracy</text>

  <line x1="32" y1="122" x2="808" y2="122" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="32" y="158" font-size="12.5" fill="#adbac7">Prompts written to test it (280)</text>
    <rect x="310" y="140" width="420" height="26" rx="3" fill="#1a1f26"/>
    <rect x="310" y="140" width="265" height="26" rx="3" fill="#6e40c9"/>
    <text x="790" y="159" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="end">63%</text>

    <text x="32" y="202" font-size="12.5" fill="#adbac7">Prompts people actually typed (363)</text>
    <rect x="310" y="184" width="420" height="26" rx="3" fill="#1a1f26"/>
    <rect x="310" y="184" width="113" height="26" rx="3" fill="#6e40c9"/>
    <text x="790" y="203" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="end">27%</text>

    <rect x="423" y="184" width="152" height="26" rx="3" fill="#6e40c9" fill-opacity="0.16" stroke="#768390" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="575" y1="136" x2="575" y2="214" stroke="#768390" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="423" y="230" font-size="11" fill="#768390">this gap is the honest part</text>
  </g>

  <line x1="32" y1="246" x2="808" y2="246" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="32" y="286" font-size="12.5" fill="#adbac7">Always answer engineering</text>
    <text x="32" y="306" font-size="11" fill="#7d8590">no router, engineering every time</text>
    <rect x="310" y="268" width="420" height="26" rx="3" fill="#1a1f26"/>
    <rect x="310" y="268" width="336" height="26" rx="3" fill="#adbac7"/>
    <text x="790" y="287" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="end">80%</text>
  </g>

  <line x1="32" y1="326" x2="808" y2="326" stroke="#30363d" stroke-width="1"/>

  <text x="32" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">The control wins on recall and speaks on every prompt that wanted silence.</text>
  <text x="32" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">The written prompts score more than double the typed ones. The typed one counts.</text>
</svg>
