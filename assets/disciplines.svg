<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" role="img" aria-label="A prompt arrives, grain scores it, and either it names one or two of the six disciplines and injects that guidance, or it stays silent on 73 percent of real prompts for zero tokens.">
  <rect width="840" height="540" rx="10" fill="#12161c"/>

  <text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" font-weight="600">what grain does on a prompt</text>
  <text x="32" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">one scoring pass per turn, then it speaks or it does not</text>

  <line x1="32" y1="86" x2="808" y2="86" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">
    <rect x="336" y="104" width="168" height="40" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="420" y="128" fill="#adbac7">a prompt arrives</text>

    <rect x="336" y="164" width="168" height="40" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <text x="420" y="188" fill="#adbac7">grain scores it</text>
  </g>

  <g stroke="#484f58" stroke-width="1" fill="none">
    <line x1="420" y1="144" x2="420" y2="157"/>
    <line x1="420" y1="204" x2="420" y2="228"/>
    <line x1="206" y1="228" x2="634" y2="228"/>
    <line x1="206" y1="228" x2="206" y2="243"/>
    <line x1="634" y1="228" x2="634" y2="243"/>
  </g>
  <g fill="#484f58">
    <polygon points="416,157 424,157 420,164"/>
    <polygon points="202,243 210,243 206,250"/>
    <polygon points="630,243 638,243 634,250"/>
  </g>

  <rect x="32" y="252" width="348" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="460" y="252" width="348" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="56" y="284" font-size="13" fill="#e6edf3" font-weight="600">it names the discipline</text>
    <text x="56" y="304" font-size="11.5" fill="#7d8590">one or two, then it injects that</text>

    <rect x="56" y="314" width="140" height="22" rx="3" fill="#1c2128"/>
    <rect x="68" y="322" width="5" height="5" fill="#6e40c9"/>
    <text x="82" y="329" font-size="11.5" fill="#adbac7">engineering</text>

    <rect x="216" y="314" width="140" height="22" rx="3" fill="#1c2128"/>
    <rect x="228" y="322" width="5" height="5" fill="#6e40c9"/>
    <text x="242" y="329" font-size="11.5" fill="#adbac7">design</text>

    <rect x="56" y="342" width="140" height="22" rx="3" fill="#1c2128"/>
    <rect x="68" y="350" width="5" height="5" fill="#6e40c9"/>
    <text x="82" y="357" font-size="11.5" fill="#adbac7">prose</text>

    <rect x="216" y="342" width="140" height="22" rx="3" fill="#1c2128"/>
    <rect x="228" y="350" width="5" height="5" fill="#6e40c9"/>
    <text x="242" y="357" font-size="11.5" fill="#adbac7">verification</text>

    <rect x="56" y="370" width="140" height="22" rx="3" fill="#1c2128"/>
    <rect x="68" y="378" width="5" height="5" fill="#6e40c9"/>
    <text x="82" y="385" font-size="11.5" fill="#adbac7">orchestration</text>

    <rect x="216" y="370" width="140" height="22" rx="3" fill="#1c2128"/>
    <rect x="228" y="378" width="5" height="5" fill="#6e40c9"/>
    <text x="242" y="385" font-size="11.5" fill="#adbac7">terse</text>

    <text x="56" y="418" font-size="11.5" fill="#768390">Two at most. A near tie emits both.</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="484" y="284" font-size="13" fill="#e6edf3" font-weight="600">it stays silent</text>
    <text x="484" y="304" font-size="11.5" fill="#7d8590">no discipline named, nothing injected</text>

    <rect x="484" y="322" width="300" height="15" rx="3" fill="#21262d"/>
    <rect x="484" y="322" width="219" height="15" rx="3" fill="#3fb950"/>
    <text x="484" y="358" font-size="12.5" fill="#3fb950" font-weight="600">73% of real prompts, zero tokens</text>

    <rect x="484" y="372" width="300" height="22" rx="3" fill="#1c2128"/>
    <text x="496" y="387" font-size="11.5" fill="#7d8590">tokens added to the turn</text>
    <text x="772" y="387" font-size="11.5" fill="#3fb950" font-weight="600" text-anchor="end">0</text>

    <text x="484" y="418" font-size="11.5" fill="#768390">Quiet is the design, not a failure.</text>
  </g>

  <line x1="32" y1="470" x2="808" y2="470" stroke="#30363d" stroke-width="1"/>

  <text x="32" y="498" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">grain speaks when the prompt is clearly in one discipline.</text>
  <text x="32" y="518" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">Most prompts are not, so most prompts cost nothing at all.</text>
</svg>
